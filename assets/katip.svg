<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.45"/>
    </filter>

    <filter id="micGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Squircle with Shadow -->
  <rect x="40" y="40" width="432" height="432" rx="100" ry="100" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Subtle Border / Highlight -->
  <rect x="40" y="40" width="432" height="432" rx="100" ry="100" fill="url(#innerGlow)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="3"/>

  <!-- Sound Waves (Left & Right) -->
  <!-- Left Waves -->
  <path d="M 170 200 A 70 70 0 0 0 170 280" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M 134 165 A 120 120 0 0 0 134 315" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.45"/>

  <!-- Right Waves -->
  <path d="M 342 200 A 70 70 0 0 1 342 280" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M 378 165 A 120 120 0 0 1 378 315" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.45"/>

  <!-- Microphone Element -->
  <g filter="url(#micGlow)">
    <!-- Mic Capsule Body -->
    <rect x="226" y="150" width="60" height="110" rx="30" ry="30" fill="#ffffff"/>

    <!-- Mic Mesh Line Accent -->
    <line x1="232" y1="205" x2="280" y2="205" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round"/>

    <!-- Mic U-Cradle -->
    <path d="M 206 215 A 50 50 0 0 0 306 215" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>

    <!-- Mic Stand Stem -->
    <line x1="256" y1="265" x2="256" y2="330" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>

    <!-- Mic Base Plate -->
    <line x1="216" y1="330" x2="296" y2="330" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Sparkling Dictation Star (Top Right of Mic) -->
  <path d="M 315 135 Q 315 150 330 150 Q 315 150 315 165 Q 315 150 300 150 Q 315 150 315 135 Z" fill="#fef08a"/>
</svg>
