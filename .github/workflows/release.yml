name: Build desktop downloads

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            asset: Katip-Windows-x64.exe
          - label: macOS Apple Silicon
            runner: macos-15
            asset: Katip-macOS-arm64.dmg
          - label: macOS Intel
            runner: macos-15-intel
            asset: Katip-macOS-x64.dmg
          - label: Fedora Linux x86_64
            runner: ubuntu-24.04
            asset: Katip-Fedora-x86_64.rpm
          - label: Arch Linux x86_64
            runner: ubuntu-24.04
            asset: Katip-ArchLinux-x86_64.pkg.tar.zst

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify release tag matches project version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          import katip

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected_tag = f"v{version}"
          if katip.__version__ != version:
              raise SystemExit("katip.__version__ and pyproject.toml must match")
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(f"Tag must be {expected_tag}; got {os.environ['RELEASE_TAG']}")
          PY

      - name: Install macOS audio build dependency
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev libasound2-dev rpm libegl1 libgl1 libxkbcommon-x11-0

      # ASVS 15.2.1: keep the release packager on a reviewed, explicit version.
      - name: Install application and pinned packager
        run: python -m pip install -r requirements-dev.txt "pyinstaller==6.20.0"

      - name: Run isolated tests
        run: python -m pytest -q

      - name: Create macOS app icon
        if: runner.os == 'macOS'
        run: sips -s format icns assets/katip-256.png --out assets/katip.icns

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # ASVS 15.2.4: keep unrelated tool DLLs out of the packaged application.
          $pythonDir = Split-Path -Parent (python -c 'import sys; print(sys.executable)')
          $env:PATH = "$pythonDir;$pythonDir\Scripts;$env:SystemRoot\System32;$env:SystemRoot"
          python -m PyInstaller katip.spec --clean --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\Katip.exe dist\Katip-Windows-x64.exe
          $smoke = Start-Process -FilePath (Resolve-Path 'dist\Katip-Windows-x64.exe').Path -ArgumentList '--version' -PassThru -WindowStyle Hidden
          if (-not $smoke.WaitForExit(30000)) {
            & "$env:SystemRoot\System32\taskkill.exe" /PID $smoke.Id /T /F | Out-Null
            throw 'Packaged Katip --version timed out after 30 seconds'
          }
          $smoke.Refresh()
          if ($smoke.ExitCode -ne 0) { exit $smoke.ExitCode }

      - name: Build macOS app and disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_ASSET: ${{ matrix.asset }}
        run: |
          python -m PyInstaller katip.spec --clean --noconfirm
          dist/Katip.app/Contents/MacOS/Katip --version
          mkdir -p dmg-root
          ditto dist/Katip.app dmg-root/Katip.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Katip -srcfolder dmg-root -ov -format UDZO "dist/$RELEASE_ASSET"

      - name: Build Fedora RPM package
        if: matrix.label == 'Fedora Linux x86_64'
        shell: bash
        env:
          RELEASE_ASSET: ${{ matrix.asset }}
        run: |
          python -m PyInstaller katip.spec --clean --noconfirm
          dist/Katip --version
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp -r dist assets katip.desktop rpmbuild/SOURCES/
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          rpmbuild -bb packaging/rpm/katip.spec \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "_sourcedir $(pwd)/rpmbuild/SOURCES" \
            --define "_version $VERSION"
          cp rpmbuild/RPMS/x86_64/*.rpm "dist/$RELEASE_ASSET"

      - name: Build Arch Linux package
        if: matrix.label == 'Arch Linux x86_64'
        shell: bash
        env:
          RELEASE_ASSET: ${{ matrix.asset }}
        run: |
          python -m PyInstaller katip.spec --clean --noconfirm
          dist/Katip --version
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          
          mkdir -p archbuild
          cp -r dist assets katip.desktop packaging/arch/PKGBUILD archbuild/
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" archbuild/PKGBUILD
          
          docker run --rm -v $(pwd)/archbuild:/build archlinux:base-devel bash -c "
            pacman -Syu --noconfirm &&
            useradd -m builduser &&
            chown -R builduser:builduser /build &&
            su - builduser -c 'cd /build && makepkg -d'
          "
          cp archbuild/*.pkg.tar.zst "dist/$RELEASE_ASSET"


      # ASVS 5.3.2: release output paths come only from fixed, version-controlled matrix entries.
      - name: Upload release asset
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          # ASVS 1.2.5: pass release data as quoted arguments, never interpolate it into shell source.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Katip $RELEASE_TAG" \
              --notes "Katip $RELEASE_TAG yayımlandı."
          fi
