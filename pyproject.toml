[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "katip"
version = "0.4.0"
description = "High-performance, low-latency cross-platform dictation assistant for Linux, Windows, and macOS"
authors = [{ name = "Fatih" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "pyaudio>=0.2.11",
    "webrtcvad-wheels>=2.0.10",
    "evdev>=1.6.0; platform_system=='Linux'",
    "pynput>=1.7.6; platform_system!='Linux'",
]

[project.scripts]
katip = "katip.__main__:main"

[project.gui-scripts]
katip-gui = "katip.__main__:main"

[tool.setuptools.packages.find]
include = ["katip*"]

[tool.setuptools.data-files]
# ASVS 5.3.2: package only these trusted, fixed asset paths.
"share/katip/assets" = [
    "assets/katip.svg",
    "assets/katip.ico",
    "assets/katip-64.png",
    "assets/katip-128.png",
    "assets/katip-256.png",
]
