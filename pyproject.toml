[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "katip"
version = "0.4.6"
description = "High-performance, low-latency cross-platform dictation assistant for Linux, Windows, and macOS"
authors = [{ name = "Fatih" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
    "requests>=2.28.0",
    "soxr>=0.5.0",
    "keyring>=25.0.0",
    "dbus-next>=0.2.3; platform_system=='Linux'",
    "pyaudio>=0.2.11",
    "webrtcvad-wheels>=2.0.10",
    "evdev>=1.6.0; platform_system=='Linux'",
    "pynput>=1.7.6; platform_system!='Linux'",
]

[project.scripts]
katip = "katip.__main__:main"

[project.gui-scripts]
katip-gui = "katip.__main__:main"

[tool.setuptools.packages.find]
include = ["katip*"]

[tool.setuptools.data-files]
# ASVS 5.3.2: package only these trusted, fixed asset paths.
"share/katip/assets" = [
    "assets/katip.svg",
    "assets/katip.ico",
    "assets/katip-64.png",
    "assets/katip-128.png",
    "assets/katip-256.png",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "psutil>=6.0.0",
    "ruff>=0.17.0",
    "mypy>=1.15.0",
    "pyinstaller==6.20.0",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]

[tool.mypy]
files = ["katip/domain", "katip/application/session.py"]
check_untyped_defs = true

[tool.pytest.ini_options]
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
